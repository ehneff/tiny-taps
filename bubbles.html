<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Soft Bubbles</title>

<!-- Full-screen install support (Android Chrome) -->
<link rel="manifest" href='data:application/manifest+json,{
  "name": "Soft Bubbles",
  "short_name": "Bubbles",
  "start_url": ".",
  "display": "fullscreen",
  "orientation": "any",
  "background_color": "%23EAF2FB",
  "theme_color": "%23EAF2FB",
  "icons": []
}'>
<meta name="theme-color" content="#EAF2FB">
<meta name="mobile-web-app-capable" content="yes">

<!-- Full-screen install support (iOS Safari) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubbles">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAF2FB;
    --ink: #5B6472;
    --ink-soft: #8791A0;
    --b1: #FFD1DC;
    --b2: #C8F4DE;
    --b3: #E3D9F7;
    --b4: #FFF3C4;
    --b5: #FFDCC2;
    --charge-good: #8FCB9B;
    --charge-slow: #F4C97A;
    --charge-none: #C9C3BD;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    overscroll-behavior:none;
    font-family:'Baloo 2', sans-serif;
    touch-action: manipulation;
  }
  #stage{
    position:fixed; inset:0;
  }

  /* ---- Battery indicator: a big breathing capsule, unmistakable at a glance ---- */
  #battery-wrap{
    position:fixed;
    top: max(18px, env(safe-area-inset-top));
    left:50%;
    transform: translateX(-50%);
    width: min(86vw, 480px);
    z-index: 50;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    pointer-events:none;
  }
  #battery-capsule{
    width:100%;
    height:34px;
    border-radius:999px;
    background: rgba(255,255,255,0.55);
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow: 0 4px 18px rgba(91,100,114,0.12);
    overflow:hidden;
    position:relative;
  }
  #battery-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background: var(--charge-none);
    transition: width 0.8s ease, background-color 0.8s ease;
  }
  #battery-fill.charging{
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ filter: brightness(1); }
    50%{ filter: brightness(1.18); }
  }
  #battery-label{
    font-size: 15px;
    font-weight:700;
    color: var(--ink);
    letter-spacing:0.3px;
    background: rgba(255,255,255,0.6);
    padding:3px 14px;
    border-radius:999px;
  }

  /* ---- Bubbles ---- */
  .bubble{
    position:absolute;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset -6px -6px 14px rgba(255,255,255,0.5), inset 6px 6px 14px rgba(0,0,0,0.03), 0 6px 16px rgba(91,100,114,0.10);
    will-change: transform;
    cursor: pointer;
  }
  .pop-particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }

  /* Parent-only reset corner (invisible, long-press) */
  #parent-corner{
    position:fixed;
    bottom:0; right:0;
    width:70px; height:70px;
    z-index:60;
  }
  #hint{
    position:fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    color: var(--ink-soft);
    font-size:12px;
    opacity:0.55;
    z-index:5;
  }
</style>
</head>
<body>

<div id="battery-wrap">
  <div id="battery-capsule"><div id="battery-fill"></div></div>
  <div id="battery-label">—</div>
</div>

<div id="stage"></div>
<div id="hint">soft bubbles · tap to pop</div>
<div id="parent-corner" title="parent: long-press to pause"></div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var colors = ['#FFD1DC','#C8F4DE','#E3D9F7','#FFF3C4','#FFDCC2'];
  var maxBubbles = 6;
  var bubbles = [];
  var running = true;

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function spawnBubble(){
    if(bubbles.length >= maxBubbles || !running) return;
    var size = rand(70, 130);
    var el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    var x = rand(0, window.innerWidth - size);
    var y = window.innerHeight + size;
    el.style.left = x+'px';
    el.style.top = y+'px';
    stage.appendChild(el);

    var speed = rand(18, 32); // seconds to float up — slow & low-sensory
    var drift = rand(-30, 30);
    var startTime = performance.now();
    var startY = y;
    var endY = -size*1.5;
    var startX = x;
    var endX = x + drift;

    var b = { el: el, alive: true };
    bubbles.push(b);

    function frame(now){
      if(!b.alive) return;
      var t = (now - startTime) / (speed*1000);
      if(t >= 1){
        removeBubble(b);
        return;
      }
      var eased = t; // linear, gentle
      var curY = startY + (endY - startY) * eased;
      var curX = startX + (endX - startX) * eased;
      var bob = Math.sin(t*Math.PI*2*1.2) * 6;
      el.style.transform = 'translate(' + bob + 'px,0) scale(' + (0.92 + 0.08*Math.sin(t*Math.PI)) + ')';
      el.style.top = curY + 'px';
      el.style.left = curX + 'px';
      if(b.alive) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    el.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      popBubble(b, size, el.style.background);
    }, {passive:false});
  }

  function removeBubble(b){
    if(!b.alive) return;
    b.alive = false;
    if(b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
    var idx = bubbles.indexOf(b);
    if(idx > -1) bubbles.splice(idx,1);
  }

  function popBubble(b, size, color){
    if(!b.alive) return;
    var rect = b.el.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    removeBubble(b);
    playChime();

    // gentle particle dissolve, not flashy
    var count = 6;
    for(var i=0;i<count;i++){
      var p = document.createElement('div');
      p.className = 'pop-particle';
      var psize = rand(8, 16);
      p.style.width = psize+'px';
      p.style.height = psize+'px';
      p.style.background = color;
      p.style.left = (cx - psize/2) + 'px';
      p.style.top = (cy - psize/2) + 'px';
      p.style.opacity = '0.85';
      stage.appendChild(p);
      var angle = (Math.PI*2/count)*i + rand(-0.2,0.2);
      var dist = rand(30, 60);
      var dx = Math.cos(angle)*dist;
      var dy = Math.sin(angle)*dist;
      var start = performance.now();
      var dur = 500;
      (function(p, dx, dy, start, dur){
        function pf(now){
          var t = (now-start)/dur;
          if(t>=1){ if(p.parentNode) p.parentNode.removeChild(p); return; }
          p.style.transform = 'translate(' + dx*t + 'px,' + dy*t + 'px)';
          p.style.opacity = String(0.85*(1-t));
          requestAnimationFrame(pf);
        }
        requestAnimationFrame(pf);
      })(p, dx, dy, start, dur);
    }
  }

  // soft chime via WebAudio — gentle, not jarring
  var audioCtx = null;
  function playChime(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var notes = [523.25, 587.33, 659.25, 783.99]; // pentatonic-ish, soft
      var freq = notes[Math.floor(Math.random()*notes.length)];
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.6);
    }catch(e){ /* audio unavailable, fail silently */ }
  }

  setInterval(function(){
    if(running) spawnBubble();
  }, 1400);
  spawnBubble();

  window.addEventListener('resize', function(){});

  // ---- Battery status ----
  var fillEl = document.getElementById('battery-fill');
  var labelEl = document.getElementById('battery-label');

  function updateBatteryUI(battery){
    var pct = Math.round(battery.level * 100);
    fillEl.style.width = pct + '%';
    var color, text;
    if(battery.charging){
      color = pct >= 40 ? 'var(--charge-good)' : 'var(--charge-slow)';
      text = pct + '% · charging';
      fillEl.classList.add('charging');
    } else {
      color = 'var(--charge-none)';
      text = pct + '% · unplugged';
      fillEl.classList.remove('charging');
    }
    fillEl.style.background = color;
    labelEl.textContent = text;
  }

  if(navigator.getBattery){
    navigator.getBattery().then(function(battery){
      updateBatteryUI(battery);
      battery.addEventListener('levelchange', function(){ updateBatteryUI(battery); });
      battery.addEventListener('chargingchange', function(){ updateBatteryUI(battery); });
    }).catch(function(){
      labelEl.textContent = 'battery status unavailable';
      fillEl.style.width = '100%';
      fillEl.style.background = 'var(--charge-none)';
    });
  } else {
    labelEl.textContent = 'battery status unavailable';
    fillEl.style.width = '100%';
    fillEl.style.background = 'var(--charge-none)';
  }

  // ---- Try to keep focus / stay fullscreen ----
  function goFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if(req){ req.call(el).catch(function(){}); }
  }
  document.addEventListener('pointerdown', goFullscreen, {once:true});

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  // ---- Hidden parent control: long-press bottom-right corner 3s pauses spawning ----
  var corner = document.getElementById('parent-corner');
  var pressTimer = null;
  corner.addEventListener('pointerdown', function(){
    pressTimer = setTimeout(function(){
      running = !running;
      document.getElementById('hint').textContent = running ? 'soft bubbles · tap to pop' : 'paused';
    }, 3000);
  });
  corner.addEventListener('pointerup', function(){ clearTimeout(pressTimer); });
  corner.addEventListener('pointerleave', function(){ clearTimeout(pressTimer); });

})();
</script>
</body>
</html>
